name: Sholat Reminder

on:
  schedule:
    # Every 5 minutes from 04:00–19:00 WIB (Jakarta)
    # GitHub UTC = WIB - 7 → 21:00–12:00 UTC
    - cron: '*/5 21-23,0-12 * * *'
  workflow_dispatch:  # manual trigger for testing

jobs:
  sholat:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to commit state.json

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run prayer reminder
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PRAYER_CITY_ID: '1301'
          PRAYER_TARGET: 'Maghrib'
          PRAYER_WINDOW: '10'
        run: python sholat_reminder.py

      - name: Commit updated state
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "No state changes to commit"
          else
            git commit -m "Update prayer state [skip ci]"
            git push
          fi
